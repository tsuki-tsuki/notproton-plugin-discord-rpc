name: Release Discord RPC plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install MinGW-w64
        run: brew install mingw-w64

      - name: Build and test
        run: make test

      - name: Package both plugin variants
        run: make release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            dist/notproton-plugin-discord-rpc.zip \
            dist/notproton-plugin-discord-rpc-session-helper.zip
