[NOTPROTON_DISCORD_BRIDGE]
label = Discord Rich Presence
description = Relays Windows games' Discord activity to the macOS Discord desktop app.
section = dev
on = 1
requires = Library/Application Support/notproton/integrations/discord-rpc/session-helper
session_helper = Library/Application Support/notproton/integrations/discord-rpc/session-helper

[NOTPROTON_DISCORD_BASIC_ACTIVITY]
label = Show basic Discord activity
description = Shows the game name and elapsed time while the game has no Discord RPC connection.
depends = NOTPROTON_DISCORD_BRIDGE
on = 1
