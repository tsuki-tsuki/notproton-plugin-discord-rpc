[NOTPROTON_DISCORD_BRIDGE]
label = Discord Rich Presence
description = Relays Windows games' Discord activity to the macOS Discord desktop app.
section = dev
on = 1
requires = Library/Application Support/notproton/integrations/discord-rpc/discord-rpc.dylib
inject = 1
env = DISCORD_RPC_PLUGIN=1
tools = notproton-26.3
tools = notproton-preview*
tools = notproton-fex-rosetta*
